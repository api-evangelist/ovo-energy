findings:
  - >-
    One well-known document exists across the whole estate: the security.txt on
    the marketing host. It is valid RFC 9116, expires 2026-12-31, routes contact
    through a Tines intake page and names https://www.ovoenergy.com/security as
    the disclosure policy.
  - >-
    No OIDC discovery, no OAuth authorization-server metadata, no api-catalog and
    no ai-plugin.json is served anywhere on the estate — consistent with there
    being no developer programme and no published auth scheme.
