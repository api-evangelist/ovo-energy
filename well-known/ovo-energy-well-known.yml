method: searched
description: >-
  Results of probing the /.well-known/ discovery surface across every OVO Energy
  host reachable from apis.yml and the review probe log. apis[] is empty — OVO
  Energy publishes no documented API — so the hosts probed are the marketing site,
  the live-but-empty public API gateway (api.ovoenergy.com), the customer portal
  (my.ovoenergy.com) and the undocumented customer-session data host
  (smartpaymapi.ovoenergy.com). Status is the HTTP code observed at fetch time on
  2026-07-27 by anonymous curl. Only a document returning a real, correctly-typed
  payload was saved verbatim: exactly one — the RFC 9116 security.txt on
  www.ovoenergy.com. my.ovoenergy.com answers 200 for any /.well-known/ path by
  redirecting into the portal login SPA (text/html), so it is recorded as
  present-but-not-a-real-document and not saved.
hosts:
  - host: https://www.ovoenergy.com
    documents:
      - path: /.well-known/security.txt
        status: 200
        type: text/plain
        file: ovo-energy-security.txt
