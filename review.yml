specHarvest:
  harvested: false
  specsCount: 0
  detail: >
    No machine-readable API contract is published by OVO Energy anywhere. Every
    /openapi.json, /swagger.json, /api-docs and .well-known/api-catalog probe on
    www.ovoenergy.com and api.ovoenergy.com returned 404. The ovotech GitHub
    organisation carries 88 public repositories of internal engineering tooling and
    none of them is a product API definition or client SDK. No spec was authored,
    because authoring one from an undocumented 401 endpoint would be fabrication
    rather than harvest. The openapi/ directory is omitted.
  openapiDirectoryOmitted: true
corporate:
  note: >
    On 11 May 2026 OVO announced it had agreed the sale of its UK energy retail
    business to E.ON and its Home Services business to Hometree, both subject to
    regulatory approval and expected to complete later in 2026, with roughly four
    million customers involved. The Kaluza software platform is explicitly excluded
    from the sale; E.ON will continue the existing Kaluza energy intelligence
    platform licence in respect of OVO's customer base and evaluate adopting Kaluza
    across the wider E.ON group outside the UK. If completed, OVO Energy's retail
    book joins E.ON Next, and this profile should be revisited alongside the
    eon-next record.
