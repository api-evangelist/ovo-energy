aid: ovo-energy
name: OVO Energy
review:
  question: What real, public API surface does OVO Energy expose, and what energy-data
    obligation actually applies to it?
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: utility-retailer
  homeMarket: United Kingdom
  primaryDomain: ovoenergy.com
  verdict: >
    Identity-only by evidence. OVO Energy publishes no developer portal, no API
    documentation, no machine-readable contract, and no third-party route to a
    customer's usage or billing data. Four developer subdomains do not resolve.
    Every developer path on the marketing site 404s. api.ovoenergy.com resolves
    and is live but answers every probed path with a bare text/plain 404. One real
    consumer endpoint exists — smartpaymapi.ovoenergy.com/usage/api/half-hourly,
    HTTP 401 JSON anonymously — but it is undocumented, unsupported, and gated to
    a signed-in customer session, so it is recorded here and deliberately NOT
    listed in apis[]. apis[] is empty. No OpenAPI was harvested and none was
    authored, because authoring one here would be fabrication.
mandate:
  regime: smart-meter-infrastructure
  regimeName: >
    The GB smart metering programme — the Smart Energy Code (SEC) and the licensed
    Data Communications Company (Smart DCC) monopoly, sitting under Ofgem electricity
    and gas supply licence conditions. This is an INFRASTRUCTURE mandate on licensed
    suppliers. It is emphatically not a consumer data right.
  status: live-implemented
  statusEvidence: >
    The obligation and the implementation were checked as separate facts, and the
    honest answer differs for each.

    The obligation: OVO holds Ofgem electricity and gas supply licences and is
    therefore a Smart Energy Code party and a DCC User, obliged to take all
    reasonable steps to install smart meters and to communicate with SMETS2 devices
    over the licensed DCC network. That obligation is real and is a licence
    condition, not a voluntary posture.

    The implementation: verified by direct anonymous HTTP probe on 2026-07-27, not
    by reading a compliance page. The strongest single artefact is
    https://smartpaymapi.ovoenergy.com/usage/api/half-hourly, which returned HTTP
    401 with an application/json body to an unauthenticated caller — a live,
    running service whose whole job is to serve half-hourly smart-meter consumption
    to an authenticated OVO customer. Half-hourly data does not exist without a
    SMETS2 estate and DCC traffic behind it. Supporting evidence: the ovoenergy.com
    site map (249 URLs) carries eleven distinct smart-metering pages including
    /smart-meters, /smart-meter-installation, /smart-meters/pay-as-you-go,
    /smart-meters/4g-upgrade (the SMETS1 enrolment/4G migration programme) and
    /guides/energy-guides/smets1-and-smets2-new-smart-meter-generation.

    What could NOT be verified, stated plainly: no machine-readable register entry
    was obtained. Ofgem's Public Register at https://epr.ofgem.gov.uk/ returned 200
    but is a client-side React SPA with no accessible JSON search endpoint
    (/api/Company/GetCompanies?searchText=OVO returned the SPA HTML shell).
    smartenergycodecompany.co.uk resolves (200) but /sec-parties/ and /parties/
    both 404. Elexon's Insights API returned 404 for a BSC-parties reference path.
    So the licence/SEC/BSC membership is asserted on the basis of OVO being a
    trading GB domestic supplier plus its own smart-meter operations, not on a
    register row this review pulled.

    The finding that matters more than the status value: this mandate is live and
    implemented and it produces ZERO developer surface. The implementation is the
    private licensed DCC User Interface and an internal customer API. A mandate
    being implemented does not make data accessible.
  notMandated: >
    There is NO consumer energy data-portability mandate in Great Britain
    equivalent to the Australian Consumer Data Right (energy) or Ontario's Green
    Button regulation. Britain mandated the pipe, not the right. OVO is under no
    obligation to expose a customer's consumption or billing data to an accredited
    third party through an API, and it does not.
  cdrRegisterEntry: >
    Not applicable to this organization — and this is the trap in the record.
    OVO Energy Pty Ltd (ABN 99 623 475 089, Melbourne VIC) publishes a Consumer
    Data Right Policy at
    https://www.ovoenergy.com.au/terms/consumer-data-right-policy/ (probed 200 on
    2026-07-27) which states plainly: "As a data holder under the CDR, we are
    required to make the following sets of data available for sharing" — account
    details, billing information and electricity usage — and requires the receiving
    party to be ACCC-accredited. It also names AEMO as the secondary data holder it
    forwards NEM usage requests to. That is a real designated CDR energy data
    holder. It is NOT this company. AGL Energy Limited took OVO Energy Pty Ltd to
    100% ownership in April 2024; OVO Energy Pty Ltd filed AER applications to
    surrender its electricity and gas retailer authorisations on 6 December 2024
    (AGL intending to retire the OVO retail brand in Australia) and withdrew both
    applications on 23 January 2025. Either way, the CDR obligation now attaches to
    an AGL-owned Australian entity, not to OVO Energy in the United Kingdom.
    Attributing `cdr-energy` to this record would be wrong.
    No CDR base URI was sought for the UK entity because none can exist.
  greenButton: >
    Not applicable. No Green Button, ESPI, Download My Data or Connect My Data
    reference appears on any OVO surface. Green Button is a North American
    standard; no GB regulation compels it and OVO has not adopted it voluntarily.
dataStandard:
  standard: no standard reference found
  detail: >
    No Green Button / ESPI, no CDR Consumer Data Standards (energy), no IEC CIM
    61968/61970, no IEEE 2030.5, no OpenADR, no OCPP or OCPI reference was found on
    any OVO Energy surface, including the EV smart-charging (Charge Anytime) and
    demand-flexibility (Power Move) product pages. The only standard genuinely in
    play is SMETS1/SMETS2 metering under the GB Smart Energy Code — and that is
    device and network infrastructure governed by a licensed monopoly, not a
    published API contract a developer can implement against. The undocumented
    internal endpoints are a proprietary REST/JSON shape with no published schema.
dataSplit:
  consumerDataApi: false
  consumerDataDetail: >
    No documented consumer data API exists. There is no accredited-recipient
    pathway, no consent API, no OAuth grant a third party can request, and no
    published schema. What does exist is a live but undocumented customer-session
    endpoint: https://smartpaymapi.ovoenergy.com/usage/api/half-hourly returned
    HTTP 401 application/json to an anonymous caller on 2026-07-27, and
    https://my.ovoenergy.com/api/auth/login redirects to the customer login page.
    These are internal product APIs for OVO's own web and mobile clients. OVO staff
    have stated on the company's own forum that these interfaces are intended for
    OVO/Kaluza and its retailer clients, are not public-facing, and may change or
    be withdrawn without notice; the community Python and Node-RED integrations
    built on them break accordingly. A reverse-engineered endpoint is not an API
    programme and is not counted as one here.
  marketDataOpen: false
  marketDataDetail: >
    Zero. OVO publishes no open grid, market, settlement or system data. No CKAN or
    other open-data portal exists on any OVO domain (data.ovoenergy.com does not
    resolve), no dataset licence is published, and no anonymous feed of any kind was
    found. This is structurally normal for a GB retailer rather than a failing: in
    Britain the open market data comes from other parties — NESO's Data Portal and
    the Carbon Intensity API, Elexon's BSC/Insights data, and the DNO open-data
    portals — none of which originates with a supplier.
  theFinding: >
    OVO is closed on BOTH axes, which is the common shape for a GB retailer and the
    exact inverse of NESO. The more interesting finding is adjacent: OVO Group owns
    Kaluza, an API-first energy intelligence platform explicitly marketed on
    "GraphQL and Streaming APIs" and licensed to utilities worldwide — Britain's
    direct analogue to Octopus Energy's Kraken. developer.kaluza.com (200, a Next.js
    application shell) and docs.kaluza.com (200, a product-module overview naming
    Energy Optimisation, Customer Care, Commerce, Billing & Payments and Data
    Intelligence) are both live. But that surface belongs to a different brand on a
    different domain, is aimed at licensee utilities rather than developers, and
    publishes no OpenAPI, no base URL, no auth model and no self-serve signup. So
    the API-native platform underneath does not translate into a public API for the
    retailer sitting on top of it — the same pattern already recorded for E.ON Next
    on Kraken. Note also that the 11 May 2026 E.ON acquisition of OVO's retail
    business explicitly excludes Kaluza, which will remain a separate business with
    E.ON continuing the platform licence.
accessGate:
  gate: customer-account-required
  whatADeveloperMustDo: >
    There is nothing to sign up for. No developer portal, no API key request form,
    no partner application, no data licence, no accreditation pathway. The only way
    to reach energy data is to become an OVO customer and sign in at
    https://my.ovoenergy.com/login or use the OVO app, then read your own usage —
    the browser account has no bulk download, and OVO has said downloadable usage
    is an app feature. A developer wanting programmatic access has exactly two
    unsupported options: scrape their own authenticated session against
    smartpaymapi.ovoenergy.com (undocumented, unsupported, known to break), or go
    around OVO entirely and pull their own smart-meter data from a DCC "Other User"
    service such as n3rgy, Bright/Hildebrand or Loop. `none-published` was
    considered for this field and rejected: a real, live, customer-authenticated
    data endpoint does exist, so the gate is the customer account, not the absence
    of any route at all.
  gated: true
authModel:
  scheme: proprietary session authentication (customer login); no published developer
    auth scheme
  detail: >
    No API key programme, no OAuth2 client registration, no OpenID Connect discovery,
    no mTLS, no CDR-style accreditation, and no documented scopes anywhere. The
    customer surface authenticates through a login at my.ovoenergy.com issuing a
    session/bearer credential consumed by OVO's own web and mobile clients; the
    downstream data endpoint enforces it (401 JSON when absent). Community reports
    describe the session credential now being produced by obfuscated client-side
    JavaScript, which is a deliberate anti-automation posture, not a developer
    programme. Nothing about the scheme is published, so nothing about it is
    recorded here as a supported contract.
  wellKnownProbe: >
    https://www.ovoenergy.com/.well-known/openid-configuration -> HTTP 404 (HTML).
    https://api.ovoenergy.com/.well-known/openid-configuration -> HTTP 404
    (text/plain, "No context-path matches the request URI"). No OIDC discovery
    document is served anywhere on the estate.
    https://www.ovoenergy.com/.well-known/api-catalog -> HTTP 404.
    https://www.ovoenergy.com/.well-known/ai-plugin.json -> HTTP 404.
    https://www.ovoenergy.com/.well-known/security.txt -> HTTP 200, a valid
    security.txt (Contact via ovo.tines.com intake page, Policy
    https://www.ovoenergy.com/security, Expires 2026-12-31, Hiring
    https://careers.ovo.com). This is the only .well-known artefact OVO publishes.
